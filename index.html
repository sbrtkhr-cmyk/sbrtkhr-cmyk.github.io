<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ユニコスクール セミナー改善ノート</title>
<style>
  :root { --bg: #f6f5f2; --surface: #fff; --text: #1f1f1f; --muted: #6b6b6b; --line: #e4e2dc; --accent: #c8102e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151515; --surface: #1f1f1f; --text: #ececec; --muted: #9a9a9a; --line: #333; --accent: #ff5a6e; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif; line-height: 1.7;
  }
  form {
    width: 100%; max-width: 380px; background: var(--surface); border-radius: 14px; padding: 28px 24px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04); display: flex; flex-direction: column; gap: 12px;
  }
  h1 { font-size: 19px; margin: 0; }
  p { margin: 0; font-size: 13px; color: var(--muted); }
  input[type="password"] {
    width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 8px;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--text);
  }
  input[type="password"]:focus { outline: none; border-color: var(--accent); }
  label.remember { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
  button {
    font: inherit; font-weight: 700; font-size: 15px; padding: 10px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: wait; }
  button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  .err { color: var(--accent); min-height: 1.4em; }
</style>
</head>
<body>
<form id="f">
  <h1>ユニコスクール セミナー改善ノート</h1>
  <p>パスワードを入力してください。</p>
  <input type="password" id="pw" autocomplete="current-password" aria-label="パスワード" required autofocus>
  <label class="remember"><input type="checkbox" id="remember" checked>このブラウザで覚える</label>
  <button id="go">開く</button>
  <p class="err" id="err" role="alert"></p>
</form>

const PW_KEY = "seminar-analysis:pw";
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function decrypt(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data));
  return new TextDecoder().decode(plain);
}

function show(html) {
  document.open();
  document.write(html);
  document.close();
}

async function open(pw, remember) {
  const html = await decrypt(pw);
  try { remember ? localStorage.setItem(PW_KEY, pw) : localStorage.removeItem(PW_KEY); } catch {}
  show(html);
}

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "確認中…"; err.textContent = "";
  try {
    await open(document.getElementById("pw").value, document.getElementById("remember").checked);
  } catch {
    err.textContent = "パスワードが違います。";
    btn.disabled = false; btn.textContent = "開く";
  }
});

// 覚えているパスワードがあれば自動で開く
(async () => {
  let saved = null;
  try { saved = localStorage.getItem(PW_KEY); } catch {}
  if (saved) {
    try { await open(saved, true); } catch { try { localStorage.removeItem(PW_KEY); } catch {} }
  }
})();
</script>
